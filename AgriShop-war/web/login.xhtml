<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Đăng nhập - AgriShop</title>
</h:head>
<h:body>
    <h2>Hệ thống Đăng nhập AgriShop</h2>
    <h:form>
        <h:messages globalOnly="true" style="color:red" />
        <h:panelGrid columns="2">
            <h:outputLabel for="username" value="Tài khoản:" />
            <h:inputText id="username" value="#{loginBean.username}" required="true" requiredMessage="Vui lòng nhập tài khoản" />
            
            <h:outputLabel for="password" value="Mật khẩu:" />
            <h:inputSecret id="password" value="#{loginBean.password}" required="true" requiredMessage="Vui lòng nhập mật khẩu" />
            
            <h:commandButton value="Đăng nhập" action="#{loginBean.login}" />
        </h:panelGrid>
    </h:form>
</h:body>
</html>
