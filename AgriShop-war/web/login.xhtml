<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Đăng nhập - AgriShop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://unpkg.com/primeflex@3.3.1/primeflex.min.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--surface-ground);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-panel {
            width: 100%;
            max-width: 400px;
        }
    </style>
</h:head>
<h:body>
    <div class="login-panel p-3">
        <h:form id="loginForm">
            <p:card>
                <f:facet name="title">
                    <div class="text-center">
                        <i class="pi pi-box text-primary" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <h2 class="m-0 text-primary">AgriShop</h2>
                        <span class="text-500 font-normal text-sm block mt-2">Hệ thống Quản trị &amp; Cửa hàng</span>
                    </div>
                </f:facet>

                <p:messages id="messages" globalOnly="true" closable="true" />

                <div class="field mt-3">
                    <p:outputLabel for="username" value="Tài khoản" styleClass="block mb-2 font-bold" />
                    <p:inputText id="username" value="#{loginBean.username}" required="true" 
                                 requiredMessage="Vui lòng nhập tài khoản" styleClass="w-full" />
                    <p:message for="username" />
                </div>

                <div class="field mt-4">
                    <p:outputLabel for="password" value="Mật khẩu" styleClass="block mb-2 font-bold" />
                    <p:password id="password" value="#{loginBean.password}" required="true" 
                                requiredMessage="Vui lòng nhập mật khẩu" toggleMask="true" styleClass="w-full" />
                    <p:message for="password" />
                </div>

                <div class="mt-3 text-right">
                    <a href="#" class="text-sm font-medium text-primary no-underline">Quên mật khẩu?</a>
                </div>

                <p:commandButton value="Đăng nhập" action="#{loginBean.login()}" 
                                 update="@form" styleClass="w-full mt-4 ui-button-primary" icon="pi pi-sign-in" />
            </p:card>
        </h:form>
    </div>
</h:body>
</html>
