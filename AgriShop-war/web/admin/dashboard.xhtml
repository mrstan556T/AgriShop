<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/adminTemplate.xhtml">
    <ui:define name="title">Dashboard - AgriShop</ui:define>
    <ui:define name="pageTitle">Tổng quan (Dashboard)</ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col-12 md:col-6 lg:col-3">
                <p:card styleClass="mb-3" style="border-left: 5px solid var(--primary-color);">
                    <div class="flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="block text-500 font-medium mb-3">Sản phẩm</span>
                            <div class="text-900 font-medium text-xl">Đang tải...</div>
                        </div>
                        <div class="flex align-items-center justify-content-center bg-blue-100 border-round" style="width:2.5rem;height:2.5rem">
                            <i class="pi pi-shopping-bag text-blue-500 text-xl"></i>
                        </div>
                    </div>
                </p:card>
            </div>
            
            <div class="col-12 md:col-6 lg:col-3">
                <p:card styleClass="mb-3" style="border-left: 5px solid #22c55e;">
                    <div class="flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="block text-500 font-medium mb-3">Doanh thu</span>
                            <div class="text-900 font-medium text-xl">Đang tải...</div>
                        </div>
                        <div class="flex align-items-center justify-content-center bg-green-100 border-round" style="width:2.5rem;height:2.5rem">
                            <i class="pi pi-dollar text-green-500 text-xl"></i>
                        </div>
                    </div>
                </p:card>
            </div>
            
            <div class="col-12 md:col-6 lg:col-3">
                <p:card styleClass="mb-3" style="border-left: 5px solid #f59e0b;">
                    <div class="flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="block text-500 font-medium mb-3">Đơn hàng mới</span>
                            <div class="text-900 font-medium text-xl">Đang tải...</div>
                        </div>
                        <div class="flex align-items-center justify-content-center bg-orange-100 border-round" style="width:2.5rem;height:2.5rem">
                            <i class="pi pi-shopping-cart text-orange-500 text-xl"></i>
                        </div>
                    </div>
                </p:card>
            </div>
            
            <div class="col-12 md:col-6 lg:col-3">
                <p:card styleClass="mb-3" style="border-left: 5px solid #ef4444;">
                    <div class="flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="block text-500 font-medium mb-3">Khách hàng</span>
                            <div class="text-900 font-medium text-xl">Đang tải...</div>
                        </div>
                        <div class="flex align-items-center justify-content-center bg-red-100 border-round" style="width:2.5rem;height:2.5rem">
                            <i class="pi pi-users text-red-500 text-xl"></i>
                        </div>
                    </div>
                </p:card>
            </div>
        </div>
        
        <p:card>
            <h3>Hệ thống Quản trị đã sẵn sàng</h3>
            <p>Chọn các chức năng bên Menu trái để thao tác với dữ liệu. Giao diện được tối ưu hóa cho tốc độ và trải nghiệm.</p>
        </p:card>
    </ui:define>
</ui:composition>
</html>
